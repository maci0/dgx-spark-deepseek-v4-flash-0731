# Production: DeepSeek V4 Flash 0731 (abliterated) on 2x DGX Spark, TP=2.
#
# Target: 3-5 concurrent sessions, NVFP4 KV cache, DSpark speculative decoding.
#
# Built as a minimal delta from the proven eugr b12x DSpark recipe. Only the
# image tag, model, KV dtype, concurrency and context differ. Deliberately keeps
# zero pre_exec hooks: this image ships b12x, nvfp4_ds_mla and DSpark natively,
# so none of the stage-c overlay rebuilding is needed.
recipe_version: "2"
model: drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32
runtime: vllm
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x:2026081903
min_nodes: 2

metadata:
  description: DeepSeek V4 Flash 0731 abliterated, NVFP4 KV + DSpark, 3-5 concurrent sessions

mods:
  - mods/instanttensor-hybrid-draft-loader

defaults:
  port: 8001
  host: 0.0.0.0
  tensor_parallel: 2
  # 0.85 targets a ~2.5M-token NVFP4 pool. The binding constraint is real free
  # memory on the worker node, not this number, so confirm the reported
  # "GPU KV cache size" rather than trusting the setting.
  gpu_memory_utilization: 0.89
  kv_cache_dtype: nvfp4_ds_mla
  max_model_len: 1048576
  block_size: 256
  # 5 concurrent sessions + 1 slot of headroom. Spec-decode buffers scale with
  # max_num_seqs x (k+1), so a larger value silently takes memory from the KV pool.
  max_num_seqs: 6
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 64
  # Must be <=5 or a multiple of the model's n_predict=5: k=7 boots then crashes
  # on first generation.
  num_speculative_tokens: 5
  thinking: "false"
  reasoning_effort: "high"

env:
  # Narrows an over-broad upstream guard that rejects any dtype starting with
  # "nvfp4" on MLA models, which wrongly catches nvfp4_ds_mla. See
  # nvfp4patch/sitecustomize.py. Plain nvfp4 + MLA still raises.
  PYTHONPATH: "/cache/huggingface/nvfp4patch"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_USE_AOT_COMPILE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  VLLM_USE_MEGA_AOT_ARTIFACT: "-1"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_WO_PROJECTION: "1"
  VLLM_USE_B12X_MHC: "1"
  VLLM_USE_B12X_FP8_GEMM: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_B12X_SPARSE_INDEXER: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  B12X_MLA_SM120_UNIFIED: "1"
  B12X_MOE_FORCE_A8: "1"

command: |
  vllm serve {model} \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype {kv_cache_dtype} \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
      --default-chat-template-kwargs.thinking={thinking} \
      --default-chat-template-kwargs.reasoning_effort={reasoning_effort} \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
      --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}}'
